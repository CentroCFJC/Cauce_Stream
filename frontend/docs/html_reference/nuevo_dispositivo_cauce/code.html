<span class="material-symbols-outlined text-[20px]">link</span>

</button>

    </button>

<script>
  let selectedDeviceId = 1;

  function switchMode(mode) {
    const btnLan = document.getElementById('btn-lan');
    const btnManual = document.getElementById('btn-manual');
    const lanPanel = document.getElementById('lan-discovery-panel');

    if (mode === 'lan') {
      btnLan.className = 'flex-1 py-2.5 px-3 rounded-xl font-label-md text-label-md font-semibold text-center transition-all duration-200 flex items-center justify-center gap-1.5 bg-surface-container-lowest text-on-surface shadow-sm';
      btnManual.className = 'flex-1 py-2.5 px-3 rounded-xl font-label-md text-label-md font-medium text-center transition-all duration-200 flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-on-surface';
      lanPanel.classList.remove('hidden');
    } else {
      btnManual.className = 'flex-1 py-2.5 px-3 rounded-xl font-label-md text-label-md font-semibold text-center transition-all duration-200 flex items-center justify-center gap-1.5 bg-surface-container-lowest text-on-surface shadow-sm';
      btnLan.className = 'flex-1 py-2.5 px-3 rounded-xl font-label-md text-label-md font-medium text-center transition-all duration-200 flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-on-surface';
      lanPanel.classList.add('hidden');
    }
  }

  function selectDevice(id, name, ip, stationType) {
    selectedDeviceId = id;
    
    // Update inputs
    document.getElementById('dev-name').value = name;
    document.getElementById('dev-ip').value = ip;

    // Reset styles for all 3 cards
    for (let i = 1; i <= 3; i++) {
      const card = document.getElementById(`device-card-${i}`);
      if (!card) continue;
      if (i === id) {
        card.className = 'p-3.5 rounded-2xl cursor-pointer transition-all bg-surface-container-lowest shadow-md ring-2 ring-primary relative overflow-hidden';
        const radio = card.querySelector('.rounded-full.shrink-0');
        if (radio) {
          radio.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shrink-0 mt-1 shadow-sm';
          radio.innerHTML = '<span class="material-symbols-outlined text-[16px] font-bold">check</span>';
        }
      } else {
        card.className = 'p-3.5 rounded-2xl cursor-pointer transition-all bg-surface-container hover:bg-surface-container-high shadow-sm relative';
        const radio = card.querySelector('.rounded-full.shrink-0');
        if (radio) {
          radio.className = 'w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant shrink-0 mt-1';
          radio.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>';
        }
      }
    }

    // Set matching station chip
    const chips = document.querySelectorAll('.station-chip');
    chips.forEach(chip => {
      const isCurrent = chip.innerText.trim().toLowerCase().includes(stationType.toLowerCase());
      if (isCurrent) {
        selectStation(stationType, chip);
      }
    });
  }

  function selectStation(type, element) {
    const allChips = document.querySelectorAll('.station-chip');
    allChips.forEach(c => {
      c.className = 'station-chip flex flex-col items-center justify-center p-2.5 rounded-xl bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all';
    });
    element.className = 'station-chip flex flex-col items-center justify-center p-2.5 rounded-xl bg-secondary text-on-secondary shadow-sm transition-all';
  }

  function simulateScan() {
    const icon = document.getElementById('scan-icon');
    const text = document.getElementById('scan-text');
    icon.classList.add('animate-spin');
    text.innerText = 'Escaneando paquetes ARP...';

    setTimeout(() => {
      icon.classList.remove('animate-spin');
      text.innerText = 'Red actualizada (3 terminales detectadas)';
    }, 900);
  }

  function handleBinding() {
    const btn = document.getElementById('submit-bind');
    const name = document.getElementById('dev-name').value;
    btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">sync</span><span>Sincronizando ' + name + '...</span>';
    btn.classList.add('opacity-90');

    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>¡Terminal Vinculada con Éxito!</span>';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-secondary');
      
      setTimeout(() => {
        window.history.back();
      }, 1000);
    }, 1200);
  }
</script></main>
