name: cauce_stream
description: "CauceStream — aplicacion movil de administracion y operacion de la Sala Cauce (CCFJC)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # HTTP contra el backend FastAPI en la LAN.
  http: ^1.2.2
  # Seleccion de archivos del equipo para la subida de medios
  # (biblioteca). Unica dependencia aniadida para RF-008 fase 1.
  file_picker: ^8.3.7
  # Directorio de cache del sistema para las miniaturas de la
  # biblioteca (unico uso: getTemporaryDirectory). Segunda
  # dependencia aniadida para la fase de data real del medio.
  path_provider: ^2.1.5
  # Almacenamiento seguro del token JWT (nunca en SharedPreferences).
  flutter_secure_storage: ^9.2.2
  # Estado de sesion y notificacion a las pantallas.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Generacion de los iconos de la app (Android legacy + adaptativo,
  # web/favicon) desde los assets del logo.
  flutter_launcher_icons: ^0.14.0
  # Decodificacion del PNG del logo en tool/gen_app_icons.dart (solo
  # build-time; no forma parte de la app).
  image: ^4.12.0

flutter:

  uses-material-design: true

  assets:
    - assets/logo_completo.png
    - assets/logo_iso.png
    - assets/decorations/
    - assets/Iconos_Dispositivos/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Plus_Jakarta_Sans/static/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Iconos de la app generados desde el logo (dart run flutter_launcher_icons).
# app_icon: cuadrado naranja con los trazos en blanco (legacy/web);
# adaptativo Android: fondo naranja (#EA580C, naranja exacto del logo)
# y trazos blancos como foreground dentro de la zona segura.
# El .ico de Windows se regenera aparte (windows/runner/resources).
flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: false
  remove_alpha_ios: false
  adaptive_icon_background: "#EA580C"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#EA580C"
    theme_color: "#EA580C"

